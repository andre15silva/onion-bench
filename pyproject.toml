[project]
name = "onion-bench"
version = "0.1.0"
description = "Can LLMs tell satirical/fake news from real news published after their training cutoff?"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "trafilatura>=2.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
hub = ["huggingface_hub>=0.25"]
figures = ["matplotlib>=3.8"]
dev = ["pytest>=8"]

[project.scripts]
onion-bench = "onion_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["onion_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
